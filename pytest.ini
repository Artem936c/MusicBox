[pytest]
; Асинхронные тесты не требуют маркера @pytest.mark.asyncio.
asyncio_mode = auto
; Область жизни цикла событий для асинхронных фикстур (pytest-asyncio >= 0.24).
asyncio_default_fixture_loop_scope = function

testpaths = tests
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --color=yes
